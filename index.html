<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fishing Island</title>
<style>
html { background: #07161f; }
body { margin: 0; }
:root, :host {
    --bg: #07161f; --panel: #0e2433; --panel2: #123149; --line: #1f4a66; --text: #e8f3f8; --muted: #8fb1c4;
    --accent: #3fd0c9; --gold: #ffd23f; --bad: #ff6b6b; --good: #7bed3a;
    --t0: #9fb4c0; --t1: #6fd16f; --t2: #4aa3ff; --t3: #c27bff; --t4: #ffb13d;
  }
  * { box-sizing: border-box; }
  .fg-root { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header .meta { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { background: var(--panel2); color: var(--text); border-color: var(--line); }
  #banner { display: none; margin: 10px 16px 0; padding: 8px 12px; border-radius: 8px; background: #3a2d10; border: 1px solid #7a5d1a; color: #ffe2a0; font-size: 13px; }
  main { padding: 12px 16px 28px; max-width: 1280px; margin: 0 auto; }
  section[hidden] { display: none; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 15px; }
  .card h3 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  #mapwrap { padding: 6px; }
  svg#map { width: 100%; height: auto; display: block; border-radius: 8px; }
  .loc { cursor: pointer; outline: none; }
  .loc .pin { transition: transform .15s; transform-origin: center; transform-box: fill-box; }
  .loc:hover .pin, .loc:focus .pin, .loc.sel .pin { transform: scale(1.18); }
  .loc.sel .ring { opacity: 1; }
  .ring { opacity: 0; fill: none; stroke: #fff; stroke-width: 2.5; stroke-dasharray: 5 4; }
  .lbl { font: 700 12px system-ui, sans-serif; fill: #fff; paint-order: stroke; stroke: #0b2233; stroke-width: 3.5px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .wxi { font-size: 19px; pointer-events: none; }
  .pl { cursor: help; }
  .pl text { font: 800 16px ui-monospace, Menlo, Consolas, monospace; text-anchor: middle; paint-order: stroke; stroke: #0a1620; stroke-width: 4px; stroke-linejoin: round; }
  .pl.me .mering { stroke: #fff; stroke-width: 2; fill: none; animation: pulse 1.6s ease-in-out infinite; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: #06121a; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 260px; box-shadow: 0 4px 16px rgba(0,0,0,.5); display: none; }
  #tip b { font-size: 14px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #000; }
  .chip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #0a1620; border: 1px solid #000; font: 800 13px ui-monospace, Menlo, monospace; margin-right: 6px; vertical-align: middle; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); color: var(--muted); }
  .tag.f { color: #7cc4ff; border-color: #2b6da3; } .tag.s { color: #5ee0d6; border-color: #1d7f7a; }
  .t0 { color: var(--t0); } .t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  code { background: #06121a; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: 12.5px; color: #ffe08a; }
  .muted { color: var(--muted); } .ok { color: var(--good); } .no { color: var(--bad); }
  .bar { height: 8px; background: #06121a; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2b9fd8, #3fd0c9); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 9px 12px; }
  .stat .k { color: var(--muted); font-size: 12px; } .stat .v { font-size: 18px; font-weight: 700; }
  .dex { display: flex; flex-wrap: wrap; gap: 5px; }
  .dex span { font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: #0a1b27; border: 1px solid var(--line); color: #5c7c8f; }
  .dex span.got { color: var(--text); border-color: #3a7a9c; background: #0f3046; }
  .wxrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .wxrow:last-child { border-bottom: 0; } .wxrow .ic { width: 24px; text-align: center; font-size: 17px; }
  .wxrow .nm { flex: 1; cursor: pointer; } .wxrow .nm:hover { color: var(--accent); }
  button.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button.btn:hover { border-color: var(--accent); }
  /* weather animation */
  @keyframes fall { from { transform: translateY(-34px); } to { transform: translateY(34px); } }
  @keyframes snow { from { transform: translate(-3px, -34px); } to { transform: translate(5px, 34px); } }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  @keyframes gust { from { transform: translateX(-36px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(36px); opacity: 0; } }
  @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
  @keyframes flash { 0%, 90%, 100% { opacity: 0; } 93% { opacity: .75; } 96% { opacity: .1; } 98% { opacity: .6; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .a-fall { animation: fall .75s linear infinite; } .a-snow { animation: snow 2.6s linear infinite; } .a-drift { animation: drift 5s ease-in-out infinite alternate; }
  .a-gust { animation: gust 1.6s linear infinite; } .a-glow { animation: glow 2.4s ease-in-out infinite; } .a-flash { animation: flash 4s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .a-fall, .a-snow, .a-drift, .a-gust, .a-glow, .a-flash, .pl.me .mering { animation: none !important; } }
  .foot { text-align: center; color: var(--muted); font-size: 12px; padding: 6px 16px 22px; }


</style>
<script>
window.addEventListener('error', function (e) {
  var b = document.getElementById('banner');
  if (b) { b.style.display = 'block'; b.textContent = 'Something went wrong in this page (' + e.message + '). Try a current version of Chrome, Edge or Firefox.'; }
});

<script>
/* Shared game data. Inlined into both the userscript and the UI page by build.js. */
const FG_DATA = (function () {
  const D = { version: 1, maxLevel: 60 };

  D.tiers = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
  D.tierXp = [5, 11, 24, 52, 120];
  D.tierW = [60, 28, 9, 2.6, 0.4];
  D.grades = [
    { n: 'Poor', m: 0.6 }, { n: 'Average', m: 0.85 }, { n: 'Good', m: 1.0 },
    { n: 'Great', m: 1.25 }, { n: 'Prime', m: 1.6 }, { n: 'Trophy', m: 2.2 }
  ];
  D.gradeCut = [20, 35, 50, 65, 82];

  // id, name, icon, bite, luck, qual, description
  D.wx = [
    ['clear', 'Clear skies', '☀️', 0, 0, 0],
    ['cloudy', 'Partly cloudy', '⛅', 0.06, 0, 0],
    ['overcast', 'Overcast', '☁️', 0.08, 0.02, 0],
    ['drizzle', 'Light drizzle', '🌦️', 0.10, 0.03, 0],
    ['rain', 'Steady rain', '🌧️', 0.14, 0.05, 0],
    ['storm', 'Thunderstorm', '⛈️', -0.18, 0.12, 4],
    ['fog', 'Heavy fog', '🌫️', -0.04, 0.06, 0],
    ['windy', 'Strong wind', '💨', -0.10, 0, 0],
    ['heat', 'Heat wave', '🔥', -0.12, 0, -4],
    ['calm', 'Golden calm', '✨', 0.12, 0.04, 3],

  ].map((a, i) => ({ idx: i, id: a[0], name: a[1], icon: a[2], bite: a[3], luck: a[4], qual: a[5] }));
  D.wxById = {};
  D.wx.forEach(w => (D.wxById[w.id] = w));

  const clim = {
    temperate: 'clear:5,cloudy:4,overcast:3,drizzle:2,rain:2,storm:1,fog:1,windy:1,heat:1,calm:1.5',
    river: 'clear:4,cloudy:4,overcast:3,drizzle:3,rain:3,storm:1,fog:2,windy:1,heat:1,calm:1.5',
    mountain: 'clear:3,cloudy:3,overcast:3,snow:3,windy:2,fog:2,storm:1,calm:1',
    swamp: 'clear:2,cloudy:2,overcast:3,drizzle:3,rain:3,storm:2,fog:4,heat:3,calm:1',
    coast: 'clear:4,cloudy:3,windy:3,drizzle:1,rain:1,storm:1,fog:2,calm:2,heat:1',
    ocean: 'clear:3,cloudy:3,windy:4,overcast:2,rain:2,storm:3,fog:2,calm:2',
    trench: 'clear:2,cloudy:3,windy:4,overcast:3,rain:2,storm:4,fog:3,calm:1'
  };
  D.climates = {};
  Object.keys(clim).forEach(k => {
    D.climates[k] = clim[k].split(',').map(p => { const [a, b] = p.split(':'); return [a, parseFloat(b)]; });
  });

  // id, name, water, kind, minLvl, boat, xpMult, x, y, climate, blurb
  D.locs = [
    ['mirror', 'Mirror Lake', 'f', 'lake', 1, 0, 1.0, 300, 335, 'temperate', 'A calm lake in the middle of the island.'],
    ['river', 'Willow River', 'f', 'river', 3, 0, 1.0, 450, 255, 'river', 'A winding river that runs from the hills to the sea.'],
    ['swamp', 'Cypress Swamp', 'f', 'swamp', 5, 0, 1.1, 195, 445, 'swamp', 'Murky water and knobby cypress knees.'],
    ['alpine', 'Alpine Lake', 'f', 'lake', 8, 0, 1.2, 255, 120, 'mountain', 'Ice-cold water beneath the peaks.'],
    ['rapids', 'Thunder Rapids', 'f', 'river', 14, 0, 1.3, 355, 175, 'mountain', 'Fast whitewater, strong fish.'],
    ['bayou', 'Black Bayou', 'f', 'swamp', 20, 1, 1.4, 120, 525, 'swamp', 'Deep backwater. A rowboat is needed.'],
    ['shore', 'Sandy Shore', 's', 'shore', 1, 0, 1.0, 655, 300, 'coast', 'Cast from the beach into the breakers.'],
    ['bay', 'Mangrove Bay', 's', 'bay', 6, 0, 1.1, 600, 505, 'coast', 'Sheltered tidal flats and mangrove roots.'],
    ['reef', 'Coral Reef', 's', 'reef', 12, 1, 1.15, 790, 405, 'ocean', 'Colorful reef just offshore. A rowboat is needed.'],
    ['deep', 'Deep Blue Ocean', 's', 'ocean', 22, 2, 1.0, 860, 195, 'ocean', 'Open water and big pelagic fish. A skiff is needed.'],
    ['trench', 'Abyssal Trench', 's', 'trench', 34, 3, 0.9, 885, 535, 'trench', 'Dark, deep water. A sport fisher is needed.']
  ].map((a, i) => ({
    idx: i, id: a[0], name: a[1], water: a[2], kind: a[3], minLvl: a[4], boat: a[5], xpMult: a[6],
    x: a[7], y: a[8], climate: a[9], blurb: a[10]
  }));
  D.locById = {};
  D.locs.forEach(l => (D.locById[l.id] = l));
  D.shop = { id: 'shop', name: 'Tackle Shop', x: 575, y: 395 };

  // name|water|tier|minW|maxW|$/kg|minLvl|locations
  const fish = `Bluegill|f|0|0.1|0.5|28|1|mirror,river,swamp
Yellow Perch|f|0|0.15|0.7|26|1|mirror,alpine,river
Pumpkinseed Sunfish|f|0|0.1|0.4|30|1|mirror,swamp,river
Black Crappie|f|0|0.2|0.9|24|1|mirror,swamp,bayou

Common Carp|f|0|1|6|8|2|mirror,river

Smallmouth Bass|f|1|0.6|3|22|4|river,mirror,rapids

Coho Salmon|f|2|2|9|20|12|rapids,river
Steelhead|f|2|2|9|22|13|rapids

Blue Catfish|f|3|10|50|9|22|river,bayou

Atlantic Croaker|s|0|0.2|0.8|26|1|shore,bay
Spot|s|0|0.1|0.4|30|1|shore,bay
Pinfish|s|0|0.1|0.3|28|1|shore,bay,reef
Whiting|s|0|0.2|0.7|26|1|shore
Atlantic Mackerel|s|0|0.3|1.2|22|2|shore,reef,deep
Sheepshead|s|1|0.8|5|20|4|shore,bay,reef
Spotted Seatrout|s|1|0.6|4|28|6|bay
Pompano|s|1|0.5|3|40|6|shore
Bluefish|s|1|0.7|6|18|6|shore,bay
Southern Flounder|s|1|0.7|5|28|7|bay,shore
Black Drum|s|1|1|10|10|8|bay,shore
Yellowtail Snapper|s|1|0.5|3|35|12|reef
Triggerfish|s|1|0.5|2.5|30|12|reef

Red Drum|s|2|2|20|16|10|bay,shore
Striped Bass|s|2|3|25|18|12|shore,bay

Red Snapper|s|2|2|15|28|15|reef

Gag Grouper|s|2|3|25|22|16|reef
Barracuda|s|2|2|25|15|16|reef,deep
Cobia|s|2|5|35|16|18|reef,deep
Mahi-Mahi|s|2|3|20|24|22|deep
King Mackerel|s|2|3|25|16|22|deep

Escolar|s|2|4|40|20|34|trench
Permit|s|3|3|25|35|24|reef,bay
Tarpon|s|3|15|80|8|24|bay
Yellowfin Tuna|s|3|15|120|18|26|deep
Wahoo|s|3|8|45|24|26|deep
Nassau Grouper|s|3|8|40|22|26|reef

Goliath Grouper|s|3|40|200|6|32|reef
Patagonian Toothfish|s|3|10|100|30|35|trench

Blue Marlin|s|4|100|400|12|38|deep
Hammerhead Shark|s|4|60|300|14|38|deep

Tiger Shark|s|4|100|400|12|42|deep,trench

Greenland Shark|s|4|100|400|14|46|trench
Coelacanth|s|4|30|90|40|50|trench`;
  D.fish = fish.split('\n').map((line, i) => {
    const a = line.split('|');
    return {
      idx: i, id: a[0].toLowerCase().replace(/[^a-z]+/g, ''), name: a[0], water: a[1], tier: +a[2],
      minW: +a[3], maxW: +a[4], ppk: +a[5], minLvl: +a[6], locs: a[7].split(',')
    };
  });
  D.fishById = {};
  D.fish.forEach(f => (D.fishById[f.id] = f));

  // Sale prices. Each species keeps its relative worth inside its tier (so a pompano still beats a croaker),
  // but the typical value of a tier is set here. A fish sells for ppk * weight^wExp * grade multiplier.
  D.wExp = 0.7;                                  // heavy fish are worth more, but not in direct proportion to their weight
  D.tierVal = [8, 28, 70, 130, 260];             // typical sale value of a Good fish of each tier
  D.saltMult = 0.8;                              // saltwater fish (boats and fuel cost money)
  D.normalizePrices = function () {
    D.fish.forEach(f => { if (f.ppk0 === undefined) f.ppk0 = f.ppk; });
    const v0 = f => f.ppk0 * Math.pow((f.minW + f.maxW) / 2, D.wExp);
    D.fish.forEach(f => {
      const peers = D.fish.filter(x => x.tier === f.tier);
      const mean = peers.reduce((s, x) => s + v0(x), 0) / peers.length;
      const rel = Math.max(0.6, Math.min(1.7, v0(f) / mean));
      f.ppk = D.tierVal[f.tier] * rel * (f.water === 's' ? D.saltMult : 1) / Math.pow((f.minW + f.maxW) / 2, D.wExp);
    });
  };
  D.normalizePrices();

  // id, name, price, bite, luck, qual, cap(kg)
  D.rods = [
    ['bamboo', 'Bamboo Pole', 0, 0, 0, 0, 8],
    ['fiberglass', 'Fiberglass Rod', 250, 0.03, 0.02, 3, 25],
    ['graphite', 'Graphite Rod', 1500, 0.06, 0.05, 6, 80],
    ['carbon', 'Carbon Pro Rod', 7000, 0.09, 0.09, 9, 200],
    ['master', 'Master Angler Rod', 30000, 0.12, 0.14, 13, 600]
  ].map((a, i) => ({ idx: i, id: a[0], name: a[1], price: a[2], bite: a[3], luck: a[4], qual: a[5], cap: a[6] }));

  // id, name, water(f/s/a), price each, bite, luck, qual

    ['worms', 'Worms', 'f', 1, 0.04, 0, 0],
    ['crickets', 'Crickets', 'f', 2, 0.05, 0.01, 0],
    ['minnows', 'Minnows', 'f', 3, 0.06, 0.03, 1],
    ['powerbait', 'Power Bait', 'f', 5, 0.08, 0.05, 2],

    D.locs.forEach(l => { s += wxOverlay('cp' + l.idx, l.x, l.y, D.wx[snap.w[l.idx]]); });
    D.locs.forEach(l => {
      const wx = D.wx[snap.w[l.idx]], fresh = l.water === 'f', lock = lockedFor(l);
      s += '<g class="loc' + (selected === l.idx ? ' sel' : '') + '" data-loc="' + l.idx + '" tabindex="0" role="button" aria-label="' + esc(l.name + ', ' + wx.name) + '" transform="translate(' + l.x + ',' + l.y + ')" opacity="' + (lock ? .72 : 1) + '">' +
        '<circle class="ring" r="19"/><g class="pin"><circle r="12" fill="' + (fresh ? '#1d70b8' : '#0b4f6c') + '" stroke="#fff" stroke-width="2.5"/><text y="5" font-size="13" text-anchor="middle">' + (lock ? '🔒' : fresh ? '🎣' : '⚓') + '</text></g>' +
        '<text class="wxi" x="19" y="-9">' + wx.icon + '</text><text class="lbl" y="30">' + esc(l.name) + '</text>' + lettersFor(l.idx) + '</g>';
    });
    s += '<g class="loc" data-loc="shop" tabindex="0" role="button" aria-label="Tackle Shop" transform="translate(' + D.shop.x + ',' + (D.shop.y - 34) + ')"><circle class="ring" r="19" cy="0"/><text class="lbl" y="64">🏪 Tackle Shop</text>' + lettersFor(-1) + '</g>';
    $('#map').innerHTML = s;
  }

  /* ---------------- tooltips + clicks on the map ---------------- */
  const tip = $('#tip');
  function tipHtml(p) {
    const f = p.best >= 0 ? D.fish[p.best] : null;
    return '<span class="dot" data-s="background:' + colors[p.pid] + '"></span><b>' + esc(p.name) + '</b><br>Freshwater Lv ' + p.fl + ' · Saltwater Lv ' + p.sl +
      '<br>' + money(p.cash) + ' · rank #' + p.rank + '<br><span class="muted">At ' + esc(locName(p.loc)) + '</span>' + (f ? '<br><span class="muted">Biggest: ' + esc(f.name) + ' ' + p.bestW + 'kg</span>' : '');
  }
  function showTip(ev, p) {
    tip.innerHTML = tipHtml(p); fixAll(); tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(innerWidth - r.width - 8, ev.clientX + 14) + 'px';
    tip.style.top = Math.min(innerHeight - r.height - 8, ev.clientY + 16) + 'px';
  }
  const pl = ev => { const g = ev.target.closest && ev.target.closest('.pl'); return g ? players.find(p => p.pid === +g.dataset.pid) : null; };
  const mapEl = $('#map');
  mapEl.addEventListener('mousemove', ev => { const p = pl(ev); if (p) showTip(ev, p); else tip.style.display = 'none'; });
  mapEl.addEventListener('mouseleave', () => (tip.style.display = 'none'));
  mapEl.addEventListener('click', ev => {
    const p = pl(ev); if (p) { showTip(ev, p); ev.stopPropagation(); return; }
    const g = ev.target.closest('.loc'); if (!g) return;
    select(g.dataset.loc === 'shop' ? 'shop' : +g.dataset.loc);
  });
  mapEl.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { const g = ev.target.closest && ev.target.closest('.loc'); if (g) { ev.preventDefault(); select(g.dataset.loc === 'shop' ? 'shop' : +g.dataset.loc); } } });
  document.addEventListener('click', () => (tip.style.display = 'none'));
  function select(v) { selected = v; drawMap(); renderSide(); fixAll(); }

  /* ---------------- side panel ---------------- */
  function peopleChips(idx) {
    const here = players.filter(p => p.loc === idx);
    return here.length ? here.map(p => '<span class="chip" data-s="color:' + colors[p.pid] + '" title="' + esc(p.name) + '">' + esc(initialOf(p.name)) + '</span>' + esc(p.name)).join(' &nbsp; ') : '<span class="muted">Nobody right now.</span>';
  }
  function renderSide() {
    const el = $('#side');
    if (selected === 'shop') {
      el.innerHTML = '<h2>🏪 Tackle Shop</h2><p class="muted">Sell your catch, buy rods, bait, boats and boat upgrades. Everything is done with chat commands.</p>' +
        '<p><code>.sell all</code> <code>.shop rods</code> <code>.shop bait</code> <code>.shop boats</code> <code>.shop upgrades</code> <code>.buy name</code></p>' +
        '<p><button class="btn" id="goShop">Open the shop catalog</button></p><h3>At the shop</h3><div>' + peopleChips(-1) + '</div><p><button class="btn" id="back">Back to island report</button></p>';
      $('#goShop').onclick = () => tab('shop'); $('#back').onclick = () => select(null);
      return;
    }
    if (selected != null) {
      const l = D.locs[selected], wx = D.wx[snap.w[l.idx]], fish = D.fish.filter(f => f.water === l.water && f.locs.includes(l.id)).sort((a, b) => a.minLvl - b.minLvl);
      const caught = me ? new Set(me.dex) : null;
      let h = '<h2>' + wx.icon + ' ' + esc(l.name) + ' <span class="tag ' + l.water + '">' + (l.water === 'f' ? 'Freshwater' : 'Saltwater') + ' · ' + l.kind + '</span></h2><p class="muted">' + esc(l.blurb) + '</p>';
      h += '<p><b>Needs:</b> ' + (l.water === 'f' ? 'Freshwater' : 'Saltwater') + ' Lv ' + l.minLvl + (l.boat ? ' + ' + D.boats[l.boat].name : '') + (me ? (lockedFor(l) ? ' <span class="no">(locked for you)</span>' : ' <span class="ok">(you can fish here)</span>') : '') + '</p>';
      h += '<p><b>Weather:</b> ' + wx.icon + ' ' + wx.name + '<br><span class="muted">' + wxEffect(wx) + '. Weather changes through the day.</span></p>';
      h += '<p>Go there: <code>.go ' + l.id + '</code> then <code>.fish</code></p><h3>Who is here</h3><div>' + peopleChips(l.idx) + '</div><h3>Fish found here</h3><table><tr><th>Fish</th><th>Size</th><th class="n">Typical $</th><th class="n">Lv</th>' + (me ? '<th></th>' : '') + '</tr>';
      fish.forEach(f => { h += '<tr><td class="t' + f.tier + '">' + esc(f.name) + '</td><td>' + f.minW + '–' + f.maxW + 'kg</td><td class="n">' + Math.round(Math.pow((f.minW + f.maxW) / 2, D.wExp || 1) * f.ppk) + '</td><td class="n">' + f.minLvl + '</td>' + (me ? '<td>' + (caught.has(f.idx) ? '✓' : '') + '</td>' : '') + '</tr>'; });
      h += '</table><p class="muted" data-s="font-size:12px">Colors: <span class="t0">common</span> · <span class="t1">uncommon</span> · <span class="t2">rare</span> · <span class="t3">epic</span> · <span class="t4">legendary</span>. Higher skill unlocks better fish and better quality.</p><p><button class="btn" id="back">Back to island report</button></p>';
      el.innerHTML = h; $('#back').onclick = () => select(null);
      return;
    }
    let h = '<h2>Island report</h2><p class="muted" data-s="margin-top:-4px">Click a spot for details. Hover a letter to see who it is.</p>';
    D.locs.forEach(l => { const w = D.wx[snap.w[l.idx]]; h += '<div class="wxrow"><span class="ic">' + w.icon + '</span><span class="nm" data-l="' + l.idx + '">' + esc(l.name) + (lockedFor(l) ? ' 🔒' : '') + '</span><span class="muted" data-s="font-size:12px">' + w.name + '</span></div>'; });
    h += '<h3>Weather effects</h3><div data-s="font-size:12.5px">';
    D.wx.forEach(w => { h += '<div>' + w.icon + ' <b>' + w.name + '</b> <span class="muted">' + wxEffect(w) + '</span></div>'; });
    h += '</div><h3>Players</h3><div data-s="font-size:12.5px">' + (players.filter(p => p.loc !== -2).map(p => '<span class="chip" data-s="color:' + colors[p.pid] + '">' + esc(initialOf(p.name)) + '</span>' + esc(p.name)).join(' &nbsp; ') || '<span class="muted">Nobody is out fishing right now.</span>') + '</div>';
    el.innerHTML = h;
    el.querySelectorAll('.nm').forEach(n => (n.onclick = () => select(+n.dataset.l)));
  }

  /* ---------------- leaderboard ---------------- */
  function renderBoard() {
    const keys = { rank: p => p.rank, fl: p => -p.fl, sl: p => -p.sl, cash: p => -p.cash, fish: p => -p.fish };
    const list = players.slice().sort((a, b) => keys[sortKey](a) - keys[sortKey](b) || a.rank - b.rank);
    const th = (k, t, n) => '<th class="sort' + (n ? ' n' : '') + '" data-k="' + k + '">' + t + (sortKey === k ? ' ▾' : '') + '</th>';
    let h = '<h2>🏆 Leaderboard</h2><table><tr>' + th('rank', '#', 1) + '<th>Angler</th>' + th('fl', 'Freshwater', 1) + th('sl', 'Saltwater', 1) + th('cash', 'Cash', 1) + th('fish', 'Caught', 1) + '<th>Biggest catch</th><th>Now</th></tr>';
    list.forEach(p => {
      const f = p.best >= 0 ? D.fish[p.best] : null;
      h += '<tr' + (me && p.pid === me.pid ? ' data-s="background:#10344a"' : '') + '><td class="n">' + p.rank + '</td><td><span class="chip" data-s="color:' + colors[p.pid] + '">' + esc(initialOf(p.name)) + '</span>' + esc(p.name) + '</td><td class="n">Lv ' + p.fl + '</td><td class="n">Lv ' + p.sl + '</td><td class="n">' + money(p.cash) + '</td><td class="n">' + p.fish + '</td><td>' + (f ? '<span class="t' + f.tier + '">' + esc(f.name) + '</span> ' + p.bestW + 'kg' : '<span class="muted">none</span>') + '</td><td class="muted">' + esc(locName(p.loc)) + '</td></tr>';
    });
    h += '</table><p class="muted" data-s="font-size:12px">Ranked by total experience across Freshwater and Saltwater skills. Click a column heading to sort. Type <code>.top</code> in chat for the quick list.</p>';
    $('#board').innerHTML = h; fixAll();
    $('#board').querySelectorAll('th.sort').forEach(t => (t.onclick = () => { sortKey = t.dataset.k; renderBoard(); }));
  }

  /* ---------------- shop catalog ---------------- */
  function renderShop() {
    const own = me || {};
    let h = '<div class="card"><h2>🏪 Tackle Shop</h2><p>Sell fish: <code>.sell all</code> · <code>.sell fresh</code> · <code>.sell salt</code> · <code>.sell bass</code>. Buy with <code>.buy name</code> (bait: <code>.buy worms 25</code>).' + (me ? ' You have <b>' + money(me.c) + '</b>.' : '') + '</p>';
    h += '<h3>Fish value</h3><p class="muted" data-s="margin:0">Price depends on the species, how heavy the fish is (heavier is worth more, but not in direct proportion) and its quality: ' + D.grades.map(g => '<b>' + g.n + '</b> ×' + g.m).join(', ') + '. Live Well upgrades add +8% per level. Higher skill gives better quality and bigger fish.</p></div>';
    h += '<div class="grid" data-s="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px">';
    h += '<div class="card"><h2>Rods</h2><table><tr><th>Rod</th><th class="n">Price</th><th class="n">Bite</th><th class="n">Luck</th><th class="n">Quality</th><th class="n">Max kg</th></tr>' + D.rods.map(r => '<tr><td>' + esc(r.name) + (own.rod === r.idx ? ' <span class="ok">✓ yours</span>' : '') + (r.price ? '<br><code>.buy ' + r.id + '</code>' : '<br><span class="muted">starter</span>') + '</td><td class="n">' + (r.price ? money(r.price) : 'free') + '</td><td class="n">+' + Math.round(r.bite * 100) + '%</td><td class="n">+' + Math.round(r.luck * 100) + '%</td><td class="n">+' + r.qual + '</td><td class="n">' + r.cap + '</td></tr>').join('') + '</table><p class="muted" data-s="font-size:12px">A rod too weak for a huge fish will lose it.</p></div>';
    h += '<div class="card"><h2>Bait</h2><table><tr><th>Bait</th><th>Water</th><th class="n">Each</th><th class="n">Bite</th><th class="n">Luck</th></tr>' + D.baits.map(b => '<tr><td>' + esc(b.name) + '<br><code>.buy ' + b.id + ' 10</code></td><td>' + (b.water === 'f' ? 'Fresh' : b.water === 's' ? 'Salt' : 'Any') + '</td><td class="n">' + money(b.price) + '</td><td class="n">+' + Math.round(b.bite * 100) + '%</td><td class="n">+' + Math.round(b.luck * 100) + '%</td></tr>').join('') + '</table><p class="muted" data-s="font-size:12px">One bait is used per cast. <code>.bait name</code> to equip.</p></div>';
    h += '<div class="card"><h2>Boats</h2><table><tr><th>Boat</th><th class="n">Price</th><th class="n">Bite</th><th>Fuel per cast</th><th>Opens</th></tr>' + D.boats.slice(1).map(b => '<tr><td>' + esc(b.name) + (own.boat === b.idx ? ' <span class="ok">✓ yours</span>' : '') + '<br><code>.buy ' + b.id + '</code></td><td class="n">' + money(b.price) + '</td><td class="n">+' + Math.round(b.bite * 100) + '%</td><td>' + b.burn + ' L ' + D.fuels[b.fuel].name + '<br><span class="muted">tank ' + b.tank + ' L</span></td><td>' + (D.locs.filter(l => l.boat === b.idx).map(l => esc(l.name)).join(', ') || '<span class="muted">best bonuses</span>') + '</td></tr>').join('') + '</table></div>';
    h += '<div class="card"><h2>⛽ Fuel</h2><table><tr><th>Fuel</th><th class="n">Price per litre</th><th>Used by</th></tr>' + Object.keys(D.fuels).map(k => '<tr><td>' + D.fuels[k].name + '<br><code>.buy ' + k + ' 20</code></td><td class="n">' + money(D.fuels[k].price) + '</td><td>' + D.boats.slice(1).filter(b => b.fuel === k).map(b => esc(b.name)).join(', ') + '</td></tr>').join('') + '</table><p class="muted" data-s="font-size:12px">A boat burns fuel on every cast out on the water (spots that need a boat). Fishing from shore is free. <code>.buy fuel full</code> fills your tank. Outboard Motor upgrades cut fuel use by 10% per level, and the Deep-Sea Trawler nets an extra fish on 40% of casts.</p></div>';
    h += '<div class="card"><h2>Boat upgrades</h2><p class="muted" data-s="margin-top:-4px">Need a boat. Three levels each.</p><table><tr><th>Upgrade</th><th>Effect</th><th class="n">Level prices</th></tr>' + D.upgrades.map((u, i) => '<tr><td>' + esc(u.name) + (own.up ? ' <span class="muted">(' + own.up[i] + '/3)</span>' : '') + '<br><code>.buy ' + (u.id === 'well' ? 'livewell' : u.id) + '</code></td><td>' + esc(u.desc) + '</td><td class="n">' + u.prices.map(money).join('<br>') + '</td></tr>').join('') + '</table></div></div>';
    $('#shop').innerHTML = h;
  }

  /* ---------------- my angler ---------------- */
  function bar(info) { return '<div class="bar"><i data-s="width:' + (info.need ? Math.min(100, (info.cur / info.need) * 100) : 100) + '%"></i></div>'; }
  function renderMe() {
    const el = $('#me');
    if (!me) { el.innerHTML = '<div class="card">Open the link from a <code>.stats</code> or <code>.shop</code> message in chat to see your own angler page.</div>'; return; }
    const p = meP(), f = lvlOf(me.f), s = lvlOf(me.s), got = new Set(me.dex);
    let h = '<div class="card"><h2>' + (p ? '<span class="chip" data-s="color:' + colors[p.pid] + '">' + esc(initialOf(p.name)) + '</span>' + esc(p.name) : 'Your angler') + '</h2><div class="cards">' +
      '<div class="stat"><div class="k">Freshwater</div><div class="v">Lv ' + f.l + '</div>' + bar(f) + '<div class="k">' + f.cur + ' / ' + (f.need || 'MAX') + ' xp</div></div>' +
      '<div class="stat"><div class="k">Saltwater</div><div class="v">Lv ' + s.l + '</div>' + bar(s) + '<div class="k">' + s.cur + ' / ' + (s.need || 'MAX') + ' xp</div></div>' +
      '<div class="stat"><div class="k">Cash</div><div class="v">' + money(me.c) + '</div><div class="k">Rank #' + (p ? p.rank : '?') + '</div></div>' +
      '<div class="stat"><div class="k">Bag</div><div class="v">' + me.bag[0] + '/' + me.bag[1] + '</div><div class="k">worth ~' + money(me.bag[2]) + '</div></div>' +
      '<div class="stat"><div class="k">Rod</div><div class="v" data-s="font-size:15px">' + esc(D.rods[me.rod].name) + '</div></div>' +
      '<div class="stat"><div class="k">Boat</div><div class="v" data-s="font-size:15px">' + esc(D.boats[me.boat].name) + '</div><div class="k">' + D.upgrades.map((u, i) => u.name + ' ' + me.up[i]).join(' · ') + '</div></div>' +
      (me.boat ? '<div class="stat"><div class="k">⛽ Fuel</div><div class="v" data-s="font-size:15px">' + (me.fu ? me.fu[D.boats[me.boat].fuel === 'diesel' ? 1 : 0] : 0) + ' / ' + D.boats[me.boat].tank + ' L</div><div class="k">' + D.fuels[D.boats[me.boat].fuel].name + ', ' + D.boats[me.boat].burn + ' L per cast on the water</div></div>' : '') + '</div>';
    h += '<h3>Bait</h3><div>' + (me.bt.length ? me.bt.map(b => esc(D.baits[b[0]].name) + ' ×' + b[1] + (b[0] === me.eq ? ' <span class="ok">(equipped)</span>' : '')).join(' &nbsp;·&nbsp; ') : '<span class="muted">none</span>') + '</div>';
    h += '<h3>Lifetime</h3><div class="cards"><div class="stat"><div class="k">Casts</div><div class="v">' + me.st[0] + '</div></div><div class="stat"><div class="k">Fish caught</div><div class="v">' + me.st[1] + '</div></div><div class="stat"><div class="k">Fish sold</div><div class="v">' + me.st[2] + '</div></div><div class="stat"><div class="k">Total earned</div><div class="v">' + money(me.st[3]) + '</div></div></div></div>';
    h += '<div class="card" data-s="margin-top:14px"><h2>Fish journal (' + me.dex.length + '/' + D.fish.length + ')</h2>';
    ['f', 's'].forEach(w => { h += '<h3>' + (w === 'f' ? 'Freshwater' : 'Saltwater') + '</h3><div class="dex">' + D.fish.filter(x => x.water === w).map(x => '<span class="' + (got.has(x.idx) ? 'got t' + x.tier : '') + '">' + (got.has(x.idx) ? esc(x.name) : '???') + '</span>').join('') + '</div>'; });
    el.innerHTML = h + '</div>';
  }

  /* ---------------- tabs + boot ---------------- */
  function tab(name) {
    root.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
    ['map', 'board', 'shop', 'me'].forEach(t => ($('#tab-' + t).hidden = t !== name));
  }
  $('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) tab(b.dataset.tab); });

  async function loadFromHash(hash) {
    let s = null;
    try { s = await decode(hash); } catch (e) { console.warn('Could not read the link data', e); }
    selected = null;
    setData(s && s.w && s.p ? s : demo());
    if (!(s && s.w && s.p) && hash.length > 3) { $('#banner').textContent = 'Could not read the data in this link, so demo data is shown. Ask for a fresh link with !map in chat.'; }
  }
  fixAll();
  return { loadFromHash, setData: s => { selected = null; setData(s); }, tab, decode, demo };
}

(function () {
  var ui = createFishingUI(document, FG_DATA);
  window.addEventListener('hashchange', function () { ui.loadFromHash(location.hash); });   // a newer chat link in the same tab refreshes the page
  ui.loadFromHash(location.hash);
})();
</script>
</body>
</html>
